<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Church Mirror</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f172a; color: #f1f5f9;
      font-family: system-ui, sans-serif;
      min-height: 100vh; display: flex;
      align-items: center; justify-content: center; padding: 24px;
    }
    .card {
      background: #1e293b; border-radius: 20px;
      padding: 48px 36px; width: 100%; max-width: 400px;
      text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .logo { margin-bottom: 16px; line-height: 0; }
    .logo svg { width: 100%; border-radius: 16px; }
    p { color: #94a3b8; margin-bottom: 36px; font-size: 0.95rem; }
    .btn {
      display: block; width: 100%; padding: 16px;
      border-radius: 14px; border: none;
      font-size: 1rem; font-weight: 600;
      cursor: pointer; text-decoration: none;
      transition: all 0.2s; margin-bottom: 12px;
    }
    .btn-receiver { background: #6366f1; color: #fff; }
    .btn-receiver:hover { background: #4f46e5; transform: translateY(-1px); }
    .btn-sender { background: #3b82f6; color: #fff; }
    .btn-sender:hover { background: #2563eb; transform: translateY(-1px); }
    .hint { font-size: 0.78rem; color: #475569; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
        <rect width="800" height="500" fill="none" />
        <g transform="translate(400, 180)">
          <rect x="-35" y="-130" width="70" height="85" rx="15" fill="#FBBC05" />
          <circle cx="0" cy="-88" r="12" fill="none" stroke="#FFFFFF" stroke-width="4"/>
          <path d="M 0,-76 V -100" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
          <rect x="-135" y="-35" width="85" height="70" rx="15" fill="#EA4335" />
          <path d="M -105,-15 H -80 V 15 H -105 Z" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
          <path d="M -98,-5 H -87 M -98,5 H -87" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
          <rect x="50" y="-35" width="85" height="70" rx="15" fill="#4285F4" />
          <polygon points="85,-12 105,0 85,12" fill="#FFFFFF" />
          <rect x="-35" y="45" width="70" height="85" rx="15" fill="#34A853" />
          <rect x="-18" y="75" width="36" height="25" rx="3" fill="none" stroke="#FFFFFF" stroke-width="4"/>
          <circle cx="0" cy="87.5" r="5" fill="#FFFFFF"/>
        </g>
        <g transform="translate(400, 380)" text-anchor="middle">
          <text font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="60" font-weight="700" fill="#FFFFFF" letter-spacing="-1">CHURCH <tspan fill="#94a3b8" font-weight="300">MIRROR</tspan></text>
          <text y="50" font-family="Roboto, sans-serif" font-size="14" font-weight="500" fill="#64748b" letter-spacing="5">VÍDEO • ÁUDIO • PDF • IMAGENS • YOUTUBE</text>
        </g>
      </svg>
    </div>
    <p>Screen mirroring para projetor de igreja</p>
    <a class="btn btn-receiver" href="/receiver.html">Abrir no Projetor</a>
    <a class="btn btn-sender" href="/sender.html">Abrir no Púlpito</a>
    <p class="hint">Ambos os dispositivos precisam estar na mesma rede ou com acesso à internet.</p>
  </div>
</body>
</html>
