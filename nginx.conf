# Coloque este arquivo em /etc/nginx/sites-available/church-mirror
# e crie um symlink: ln -s /etc/nginx/sites-available/church-mirror /etc/nginx/sites-enabled/
# Depois rode: certbot --nginx -d seudominio.com

server {
    listen 80;
    server_name seudominio.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name seudominio.com;

    # Gerado pelo certbot:
    ssl_certificate     /etc/letsencrypt/live/seudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seudominio.com/privkey.pem;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;

        # Necessário para Socket.io (WebSocket upgrade)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
